<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Windows 10 Calculator GUI</title>
    <!-- CheerpJ WebAssembly Loader -->
    <script src="https://cjrtnc.leaningtech.com/3.1/loader.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #loading {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #ccc;
            z-index: 10;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #333;
            border-top: 4px solid #0078d7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #cheerpjDisplay {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <p>Iniciando Java en el navegador...</p>
    </div>

    <script type="module">
        async function run() {
            try {
                await cheerpjInit();
                cheerpjCreateDisplay(-1, -1, document.body);
                const loading = document.getElementById('loading');
                if (loading) loading.style.display = 'none';
                await cheerpjRunJar("/app/Windows10Calculator.jar");
            } catch (err) {
                console.error("Error al iniciar CheerpJ:", err);
                const loading = document.getElementById('loading');
                if (loading) loading.innerHTML = '<p style="color: #ff5555;">Error al cargar Java WebAssembly.</p>';
            }
        }
        run();
    </script>
</body>
</html>
